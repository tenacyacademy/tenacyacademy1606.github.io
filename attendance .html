<body>

<header>
    <h1>PAUL ACADEMY</h1>
    <p>Student Attendance System</p>
</header>

<div class="container">

<a class="back" href="tutor.html">← Back to Tutor Dashboard</a>

<div class="card">

<h2>📅 Take Attendance</h2>

<label>Date</label>
<input type="date" id="attendanceDate">

<label>Grade</label>

<select id="grade">
    <option value="1">Grade 1</option>
    <option value="2">Grade 2</option>
    <option value="3">Grade 3</option>
    <option value="4">Grade 4</option>
    <option value="5">Grade 5</option>
    <option value="6">Grade 6</option>
    <option value="7">Grade 7</option>
    <option value="8" selected>Grade 8</option>
    <option value="9">Grade 9</option>
    <option value="10">Grade 10</option>
    <option value="11">Grade 11</option>
    <option value="12">Grade 12</option>
</select>

<label>Subject</label>

<input
    type="text"
    id="subject"
    placeholder="Example: Mathematics"
>

</div>

<div class="card">

<h2>👨‍🎓 Students</h2>

<div id="students"></div>

<button onclick="saveAttendance()">
    💾 Save Attendance
</button>

<div id="message" class="success">
    Attendance saved successfully!
</div>

</div>

<div class="card">

<h2>📊 Attendance Records</h2>

<div id="records"></div>

</div>

</div>

<script>

const students = [

    {
        id:"ST001",
        name:"Example Student",
        grade:"8"
    },

    {
        id:"ST002",
        name:"Abebe Student",
        grade:"8"
    },

    {
        id:"ST003",
        name:"Sara Student",
        grade:"8"
    }

];


function showStudents(){

    const grade =
        document.getElementById("grade").value;

    const container =
        document.getElementById("students");

    container.innerHTML="";

    const filtered =
        students.filter(
            student => student.grade === grade
        );

    if(filtered.length === 0){

        container.innerHTML =
            "<p>No students found for this grade.</p>";

        return;
    }

    filtered.forEach(student => {

        container.innerHTML += `

        <div class="student">

            <div class="student-info">
[9/25/2026 2:51 PM] Paulos Bunaro: <strong>
                    ${student.name}
                </strong>

                <span>
                    Student ID: ${student.id}
                </span>

            </div>

            <select
                class="status"
                data-id="${student.id}"
            >

                <option value="Present">
                    Present
                </option>

                <option value="Absent">
                    Absent
                </option>

                <option value="Late">
                    Late
                </option>

            </select>

        </div>

        ;

    });

}


function saveAttendance(){

    const date =
        document.getElementById("attendanceDate").value;

    const grade =
        document.getElementById("grade").value;

    const subject =
        document.getElementById("subject").value;

    if(!date){

        alert("Please select a date.");

        return;
    }

    if(!subject){

        alert("Please enter the subject.");

        return;
    }

    const statuses =
        document.querySelectorAll(".status");

    let records =
        JSON.parse(
            localStorage.getItem("paulAttendance")
        ) || [];

    statuses.forEach(status => {

        records.push({

            date:date,

            grade:grade,

            subject:subject,

            studentId:
                status.dataset.id,

            status:
                status.value

        });

    });

    localStorage.setItem(
        "paulAttendance",
        JSON.stringify(records)
    );

    document.getElementById("message").style.display =
        "block";

    showRecords();

}


function showRecords(){

    const container =
        document.getElementById("records");

    const records =
        JSON.parse(
            localStorage.getItem("paulAttendance")
        ) || [];

    container.innerHTML="";

    if(records.length === 0){

        container.innerHTML =
            "<p>No attendance records yet.</p>";

        return;
    }

    records.slice().reverse().forEach(record => {

        const student =
            students.find(
                s => s.id === record.studentId
            );

        const studentName =
            student ? student.name : record.studentId;

        container.innerHTML += 

        <div class="attendance-record">

            <strong>
                ${studentName}
            </strong>

            <p>
                Date: ${record.date}
            </p>

            <p>
                Grade: ${record.grade}
                |
                Subject: ${record.subject}
            </p>

            <p>
                Status:
                <strong>${record.status}</strong>
            </p>

        </div>

        `;

    });

}


document.getElementById("grade")
    .addEventListener(
        "change",
        showStudents
    );


document.getElementById("attendanceDate")
    .value =
    new Date().toISOString().split("T")[0];


showStudents();

showRecords();

</script>

</body>
</html>
