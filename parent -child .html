<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>PAUL ACADEMY | My Child</title>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fc;
      color: #172b4d;
    }

    .navbar {
      background: #061d46;
      color: white;
      padding: 18px 25px;

      display: flex;
      justify-content: space-between;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    .profile {
      background: white;
      padding: 30px;
      margin-top: 25px;
      border-radius: 15px;

      box-shadow:
      0 5px 18px rgba(0,0,0,0.08);
    }

    .profile p {
      color: #667085;
      margin: 12px 0;
    }

    button {
      margin-top: 25px;
      padding: 12px 20px;

      border: 0;
      border-radius: 8px;

      background: #061d46;
      color: white;

      cursor: pointer;
    }

  </style>

</head>

<body>

  <div class="navbar">

    <strong>
      PAUL ACADEMY
    </strong>

    <span>
      👨‍👩‍👧 Parent
    </span>

  </div>


  <div class="container">

    <h1>
      My Child
    </h1>

    <p>
      Your child's information.
    </p>


    <div class="profile">

      <h2>
        👨‍🎓 Example Student
      </h2>

      <p>
        Student ID: ST001
      </p>

      <p>
        Grade: Grade 8
      </p>

      <p>
        Parent: Example Parent
      </p>

      <p>
        Status: Active
      </p>

    </div>


    <button
      onclick="location.href='parent.html'">

      Back to Parent Dashboard

    </button>

  </div>

</body>
</html>
