<script>

const students = {

    ST001:"Example Student",

    ST002:"Abebe Student",

    ST003:"Sara Student"

};


function saveResult(){

    const student =
        document.getElementById("student").value;

    const grade =
        document.getElementById("grade").value;

    const subject =
        document.getElementById("subject").value.trim();

    const type =
        document.getElementById("type").value;

    const mark =
        document.getElementById("mark").value;

    if(!subject){

        alert("Please enter the subject.");

        return;
    }

    if(mark === ""){

        alert("Please enter the mark.");

        return;
    }

    if(mark < 0 || mark > 100){

        alert("Mark must be between 0 and 100.");

    }

    let results =
        JSON.parse(
            localStorage.getItem("paulResults")
        ) || [];

    results.push({

        studentId:student,

        studentName:students[student],

        grade:grade,

        subject:subject,

        type:type,

        mark:Number(mark),

        date:
            new Date().toLocaleDateString()

    });

    localStorage.setItem(
        "paulResults",
        JSON.stringify(results)
    );

    document.getElementById("message")
        .style.display="block";

    document.getElementById("subject").value="";

    document.getElementById("mark").value="";

    showResults();

}


function showResults(){

    const container =
        document.getElementById("resultsList");

    const results =
        JSON.parse(
            localStorage.getItem("paulResults")
        ) || [];

    container.innerHTML="";

    if(results.length === 0){

        container.innerHTML=
            <div class="no-data">
                No results have been entered yet.
            </div>
        ;

        return;
    }

    results.slice().reverse().forEach(result => {

        container.innerHTML += 

        <div class="result">

            <h3>
                👨‍🎓 ${result.studentName}
            </h3>

            <p>
                <strong>Grade:</strong>
                ${result.grade}
            </p>

            <p>
                <strong>Subject:</strong>
                ${result.subject}
            </p>

            <p>
                <strong>Assessment:</strong>
                ${result.type}
            </p>

            <p class="mark">
                Mark: ${result.mark}/100
            </p>

            <p>
                Date: ${result.date}
            </p>

        </div>

        ;

    });

}


showResults();

</script>
