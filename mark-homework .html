<body>

<header>
    <h1>PAUL ACADEMY</h1>
    <p>Tutor Homework Marking</p>
</header>

<div class="container">

<a class="back" href="tutor.html">← Back to Tutor Dashboard</a>

<h2>📝 Student Homework Submissions</h2>

<div id="homeworkList"></div>

</div>

<script>

let homework =
    JSON.parse(localStorage.getItem("paulHomework")) || [];

function displayHomework(){

    const container =
        document.getElementById("homeworkList");

    container.innerHTML = "";

    let hasSubmission = false;

    homework.forEach((hw, hwIndex) => {

        if(!hw.answers || hw.answers.length === 0){
            return;
        }

        hasSubmission = true;

        let answersHTML = "";

        hw.answers.forEach((answer, answerIndex) => {

            answersHTML += 
            <div class="answer">

                <h3>👨‍🎓 Student: ${answer.student}</h3>

                <div class="answer-box">
                    <strong>Student Answer:</strong>

                    <p>
                        ${answer.answer}
                    </p>
                </div>

                <label>Mark</label>

                <input
                    type="text"
                    id="mark-${hwIndex}-${answerIndex}"
                    value="${answer.mark || ""}"
                    placeholder="Example: 85/100"
                >

                <label>Feedback</label>

                <textarea
                    id="feedback-${hwIndex}-${answerIndex}"
                    placeholder="Write feedback for the student..."
                >${answer.feedback || ""}</textarea>

                <button
                    onclick="saveMark(${hwIndex}, ${answerIndex})">
                    💾 Save Mark & Feedback
                </button>

            </div>
            ;
        });

        container.innerHTML += `

        <div class="homework">

            <h2>${hw.title}</h2>

            <div class="info">
                <strong>Grade:</strong> ${hw.grade}
                &nbsp; | &nbsp;
                <strong>Subject:</strong> ${hw.subject}
            </div>
[9/25/2026 2:40 PM] Paulos Bunaro: <div class="question">
                <strong>Homework Questions / Instructions:</strong>

                <p>${hw.questions}</p>
            </div>

            ${answersHTML}

        </div>

        ;
    });

    if(!hasSubmission){

        container.innerHTML = 
            <div class="no-data">
                <h2>📭 No Submissions Yet</h2>
                <p>
                    Students have not submitted any homework yet.
                </p>
            </div>
        ;
    }
}


function saveMark(hwIndex, answerIndex){

    const mark =
        document.getElementById(
            mark-${hwIndex}-${answerIndex}
        ).value;

    const feedback =
        document.getElementById(
            feedback-${hwIndex}-${answerIndex}`
        ).value;

    homework[hwIndex].answers[answerIndex].mark =
        mark;

    homework[hwIndex].answers[answerIndex].feedback =
        feedback;

    localStorage.setItem(
        "paulHomework",
        JSON.stringify(homework)
    );

    alert("✅ Mark and feedback saved successfully!");

    displayHomework();
}


displayHomework();

</script>

</body>
