<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PAUL ACADEMY | Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #061d46, #174ea6);
    }

    .login-box {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      color: #061d46;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #061d46;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #174ea6;
    }

    .message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">PAUL ACADEMY</div>

    <div class="subtitle">
      Learn Today. Lead Tomorrow.
    </div>

    <form id="loginForm">

      <label>Username</label>

      <input
        type="text"
        id="username"
        placeholder="Enter username"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <label>Login As</label>

      <select id="role" required>

        <option value="">
          Select your role
        </option>

        <option value="admin">
          Admin
        </option>

        <option value="tutor">
          Tutor
        </option>

        <option value="parent">
          Parent
        </option>

        <option value="student">
          Student
        </option>

      </select>

      <button type="submit">
        LOGIN
      </button>

      <div class="message" id="message"></div>

    </form>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://tbklfbkpgwjtmmhrwdgw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DdztCrONUiyZAkuD3aRTkw_9egU_NBz";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("loginForm").addEventListener(
  "submit",
  async function(event) {
    event.preventDefault();

    const email = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const selectedRole = document.getElementById("role").value;
    const message = document.getElementById("message");

    message.textContent = "Logging in...";
    message.style.color = "blue";

    try {
      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        throw new Error("Email or password is incorrect.");
      }

      const user = data.user;

      const { data: roleData, error: roleError } =
        await supabaseClient
          .from("user_roles")
          .select("role")
          .eq("user_id", user.id)
          .maybeSingle();

      if (roleError) {
        throw new Error(
          "Could not verify your role. Please try again."
        );
      }

      if (!roleData) {
        await supabaseClient.auth.signOut();
        throw new Error("Your account has no assigned role.");
      }

      const actualRole = roleData.role;

      const expectedRole =
        selectedRole === "tutor" ? "teacher" : selectedRole;

      if (actualRole !== expectedRole) {
        await supabaseClient.auth.signOut();
        throw new Error("The selected role does not match your account.");
      }

      const pages = {
        admin: "admin.html",
        teacher: "tutor.html",
        parent: "parent.html",
        student: "student.html"
      };

      const destination = pages[actualRole];

      if (!destination) {
        await supabaseClient.auth.signOut();
        throw new Error("No dashboard is configured for this role.");
      }

      window.location.href = destination;

    } catch (error) {
      message.textContent = "❌ " + error.message;
      message.style.color = "red";
    }
  }
);
</script>

</body>
</html>
