<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAUL ACADEMY | Learn Today. Lead Tomorrow.</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#f5f8ff;
  color:#10234b;
}

/* NAVBAR */
nav{
  height:78px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#061d46;
  color:white;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:27px;
  font-weight:900;
}

.logo span{
  color:#fbbd24;
}

nav ul{
  display:flex;
  gap:28px;
  list-style:none;
}

nav a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

nav a:hover{
  color:#fbbd24;
}

.login{
  background:#fbbd24;
  color:#10234b!important;
  padding:12px 22px;
  border-radius:30px;
}

/* HERO */
.hero{
  min-height:650px;
  padding:70px 5%;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:40px;

  background:
    linear-gradient(110deg,#ffffff 35%,rgba(255,255,255,.7)),
    url("images/paul-academy-homepage.png");

  background-size:cover;
  background-position:center;
}

.hero-text{
  max-width:650px;
}

.badge{
  display:inline-block;
  background:#1854bd;
  color:white;
  padding:10px 20px;
  border-radius:10px;
  font-weight:bold;
  margin-bottom:22px;
}

.hero h1{
  font-size:72px;
  line-height:.98;
  margin-bottom:18px;
  font-weight:900;
}

.hero h1 span{
  color:#fbbd24;
}

.hero h2{
  font-size:27px;
  margin-bottom:15px;
}

.hero p{
  font-size:18px;
  line-height:1.7;
  color:#52627d;
  max-width:600px;
  margin-bottom:25px;
}

.buttons{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.btn{
  padding:15px 25px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  display:inline-block;
  transition:.3s;
}

.start{
  background:#071e49;
  color:white;
}

.explore{
  border:2px solid #071e49;
  color:#071e49;
}

.btn:hover{
  transform:translateY(-4px);
}

/* FEATURES */
.features{
  margin-top:-5px;
  padding:0 5% 35px;
  background:#061d46;
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
}

.feature{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.feature-icon{
  font-size:35px;
  margin-bottom:10px;
}

.feature h3{
  margin-bottom:8px;
}

.feature p{
  color:#64748b;
  font-size:14px;
  line-height:1.5;
}

/* GRADES */
.grades{
  padding:75px 5%;
  background:#061d46;
  color:white;
}

.title{
  margin-bottom:30px;
}

.title h2{
  font-size:35px;
}

.grade-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
}

.grade{
  padding:20px 10px;
  border-radius:12px;
  text-align:center;
  text-decoration:none;
  color:white;
  font-weight:bold;
  transition:.3s;
}

.grade:hover{
  transform:translateY(-6px);
  box-shadow:0 10px 25px rgba(255,255,255,.15);
}

.primary{
  background:#20a35a;
}

.junior{
  background:#1769d1;
}

.secondary{
  background:#7040c7;
}

.grade small{
  display:block;
  margin-top:7px;
  opacity:.9;
}

/* SUBJECT SECTION */
.subject-section{
  padding:80px 5%;
  background:white;
}

.subject-title{
  text-align:center;
  margin-bottom:40px;
}

.subject-title h2{
  font-size:38px;
}

.subject-title p{
  color:#64748b;
  margin-top:10px;
}

.subject-grid{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px;
}

.subject{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  padding:25px;
  border-radius:18px;
  text-align:center;
  font-weight:bold;
  transition:.3s;
}

.subject:hover{
  background:#eff6ff;
  border-color:#2563eb;
  transform:translateY(-5px);
}

/* FOOTER */
footer{
  background:#07152f;
  color:white;
  text-align:center;
  padding:40px 5%;
}

footer h2{
  font-size:27px;
  margin-bottom:10px;
}

footer span{
  color:#fbbd24;
}

footer p{
  color:#94a3b8;
}

/* MOBILE */
@media(max-width:900px){

  nav ul{
    display:none;
  }
