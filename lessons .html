<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAUL ACADEMY | Lessons</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f8ff;
    color:#10244a;
}

.header{
    background:#061d46;
    color:white;
    text-align:center;
    padding:25px;
}

.header h1{
    margin:0;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:20px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    background:#061d46;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    text-decoration:none;
}

.info{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:25px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.lessons{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.lesson{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.lesson-number{
    background:#061d46;
    color:white;
    width:45px;
    height:45px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

.lesson h3{
    margin-top:15px;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.btn{
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    background:#061d46;
    color:white;
}

.btn.video{
    background:#d62828;
}

.btn.note{
    background:#198754;
}

.btn.exam{
    background:#6f42c1;
}

</style>

</head>

<body>

<div class="header">

<h1>PAUL ACADEMY</h1>

<p id="subjectTitle">
Lessons
</p>

</div>


<div class="container">

<a href="subjects.html" class="back">
← Back to Subjects
</a>


<div class="info">

<h2 id="mainTitle">
Lessons
</h2>

<p>
Learn step by step with lessons, videos, notes and exams.
</p>

</div>


<div class="lessons" id="lessonList"></div>

</div>


<script>

const grade =
localStorage.getItem("selectedGrade");

const subject =
localStorage.getItem("selectedSubject");


document.getElementById("subjectTitle").innerHTML =
"Grade " + grade + " • " + subject;


document.getElementById("mainTitle").innerHTML =
subject + " Lessons";


const lessons = [

{
title:"Introduction",
description:"Basic introduction to this subject."
},

{
title:"Lesson 2",
description:"Learn the main ideas and concepts."
},

{
title:"Lesson 3",
description:"Practice important skills."
},

{
title:"Lesson 4",
description:"Work through examples and exercises."
},

{
title:"Lesson 5",
description:"Review what you have learned."
},

{
title:"Lesson 6",
description:"Practice and prepare for exams."
}

];


const lessonList =
document.getElementById("lessonList");


lessons.forEach((lesson,index)=>{

const div =
document.createElement("div");

div.className="lesson";

div.innerHTML=

<div class="lesson-number">
${index + 1}
</div>

<h3>
${lesson.title}
</h3>

<p>
${lesson.description}
</p>

<div class="buttons">

<button class="btn"
onclick="openLesson(${index + 1})">
📖 Open Lesson
</button>

<button class="btn video"
onclick="openVideo(${index + 1})">
▶ Video
</button>

<button class="btn note"
onclick="openNotes(${index + 1})">
📝 Notes
</button>

<button class="btn exam"
onclick="openExam(${index + 1})">
📚 Exam
</button>

</div>

;

lessonList.appendChild(div);

});


function openLesson(number){

localStorage.setItem(
"selectedLesson",
number
);

alert(
"Lesson " + number +
" selected for " +
subject
);

}


function openVideo(number){

alert(
"Video for Lesson " +
number +
" will be added here."
);

}


function openNotes(number){

alert(
"Notes for Lesson " +
number +
" will be added here."
);

}


function openExam(number){

alert(
"Exam for Lesson " +
number +
" will be added here."
);

}

</script>

</body>

</html>
